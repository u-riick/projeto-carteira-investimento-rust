[package]
name = "projeto_carteira"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"]}
color-eyre = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = {version = "1.53.1", features = ["rt-multi-thread", "macros"]}
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sqlx = { version = "0.9.0", features = ["macros", "runtime-tokio", "postgres", "migrate"] }
dotenvy = "0.15.7"
password-auth = "1.0.0"
askama = { version = "0.16.0", features = ["derive"] }
axum-extra = { version = "0.12.6", features = ["cookie-signed"] }
jwt-simple = { version = "0.13.1", default-features = false, features = ["pure-rust"] }
time = { version = "0.3.55", features = ["serde"] }

[dev-dependencies]
insta = { version = "1.48.0", features = ["json"] }
